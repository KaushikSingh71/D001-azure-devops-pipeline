trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  backendImageName: 'd001-backend'
  frontendImageName: 'd001-frontend'
  dockerRegistryServiceConnection: 'ACR-Service-Connection'
  containerRegistry: 'youracr.azurecr.io'
  imageTag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: Build Application

  jobs:

  - job: BuildBackend
    displayName: Build Backend

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements.txt
      displayName: Install Backend Dependencies

    - script: |
        python -m py_compile app/backend/app.py
      displayName: Validate Python Code

    - task: Docker@2
      displayName: Build Backend Image
      inputs:
        command: build
        Dockerfile: app/backend/Dockerfile
        repository: $(backendImageName)
        tags: |
          $(imageTag)

  - job: BuildFrontend
    displayName: Build Frontend

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Build Frontend Image
      inputs:
        command: build
        Dockerfile: app/frontend/Dockerfile
        repository: $(frontendImageName)
        tags: |
          $(imageTag)
