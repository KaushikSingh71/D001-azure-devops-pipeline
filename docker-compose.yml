version: '3.9'

services:

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: d001-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: d001-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
