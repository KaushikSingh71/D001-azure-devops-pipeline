apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: d001-devops
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:

      - name: frontend

        image: youracr.azurecr.io/d001-frontend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"

        livenessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 10
          periodSeconds: 5
