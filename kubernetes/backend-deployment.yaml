apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: d001-devops
  labels:
    app: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: youracr.azurecr.io/d001-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 20
          periodSeconds: 10

        readinessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 10
          periodSeconds: 5
